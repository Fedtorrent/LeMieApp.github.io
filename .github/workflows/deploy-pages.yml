name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  pages: write
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v4

      - name: Build your site
        run: |
          # Create the dist directory with your built content
          # Example options below - uncomment the one that matches your project:
          
          # For a static site (just copy files):
          mkdir -p dist
          cp -r *.html *.css *.js dist/ 2>/dev/null || true
          
          # OR for Node.js/npm projects:
          # npm install
          # npm run build
          
          # OR for Python/Jekyll:
          # bundle install
          # bundle exec jekyll build -d dist

      - name: Upload artifact for GitHub Pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
